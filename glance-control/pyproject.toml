[project]
name = "glance-control"
version = "0.1.0"
description = "Scriptable, self-hostable control for the GlanceLED Classic (ESP32) ticker"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "Pillow>=10.0",
]

[project.optional-dependencies]
recon = [
    "scapy>=2.5",   # pcap parsing in glance.recon.analyze
]

[project.scripts]
glance = "glance.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["glance*"]
